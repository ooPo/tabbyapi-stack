# Qwen3.8-27B exl3 3.50bpw. Same as the 3.0bpw config except:
#   - 60k context: the most that fits on 16GB alongside MTP (64k fails).
#     Without MTP it fits 104k, but decode speed halves (20 vs 42 T/s).

network:
  host: 0.0.0.0
  port: 5000
  # Block browser (cross-origin) callers. Server-side clients are unaffected.
  allowed_origins: []

sampling:
  override_preset: qwen

model:
  model_name: Qwen3.8-27B-exl3_3.50bpw
  vision: false
  max_seq_len: 61440 # 60k
  cache_mode: 6,5
  gpu_split_auto: true
  tool_format: qwen3_coder
  reasoning: true
  # Model defaults are xhigh effort and preserved thinking from every past turn,
  # which is slow and fills context fast. Clients can still override per request.
  template_vars_default: {reasoning_effort: medium, preserve_thinking: false}
  # Force the end of thinking after this many tokens (per-request override: reasoning_budget_tokens).
  reasoning_budget_tokens: 16384
  chunk_size: 4096 # 4k
  max_batch_size: 1

draft_model:
  draft_mode: mtp
  # Draft up to 4 tokens, cut short when the drafter is unsure. Measured best on
  # 3.0bpw (5 is slower, 6+ does not fit in VRAM).
  draft_num_tokens: 4
  dynamic_draft: true

logging:
  log_prompt: false
  log_generation_params: false

memory:
  # Keep K/V pages evicted from VRAM in system RAM, so returning to a conversation
  # restores it instead of reprocessing it (35k tokens: 0.7s instead of 55s).
  # Reserves about 9 GB of pinned RAM at load; holds roughly 360k tokens.
  sysmem_kv_cache: 8192
