services:
  tabbyapi:
    # Pinned to the build tested here (2026-10-23, tabbyAPI 564f8fb, exllamav3 1.6.4).
    # exllamav3 1.6.4 can break prompt caching for long prompts containing CRLF
    # line endings (fixed in 1.6.5). To upgrade, see "Upgrading" in the README.
    image: ghcr.io/theroyallab/tabbyapi@sha256:4a4d39f48e385b65aaa56bbf7c55da0688c4ee87319220a7637b06bbd3d2f91f
    container_name: tabbyapi
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Model files (each model in its own subfolder)
      - ./models:/app/models
      # Caps image size at 4K (8.4M pixels, ~8k tokens); larger images are downscaled.
      # The models' own cap (16.7M) runs out of VRAM from about 5K. Mounted over
      # each model's copy, so the downloaded files stay untouched.
      - ./configs/vision-preprocessor.json:/app/models/Qwen3.8-27B-exl3_3.00bpw/preprocessor_config.json:ro
      - ./configs/vision-preprocessor.json:/app/models/Qwen3.8-27B-exl3_3.50bpw/preprocessor_config.json:ro
      # Server config; pick a variant with e.g. TABBY_CONFIG=configs/qwen3.8-27b-3.0bpw.yml docker compose up -d
      - ./${TABBY_CONFIG:-configs/qwen3.8-27b-3.5bpw.yml}:/app/config.yml
      # API key file. Create it before first launch (see README): if it's missing,
      # Docker creates a directory here instead and TabbyAPI can't use it.
      - ./api_tokens.yml:/app/api_tokens.yml
      # Sampler override presets (referenced by config.yml's sampling.override_preset)
      - ./sampler_overrides:/app/sampler_overrides
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    # Healthy only when the server reports no errors AND a model is loaded.
    # Catches failures after a successful load (server errors, a hang). A model
    # that fails to load makes TabbyAPI exit instead, which shows up as a restart
    # loop ("Up 3 seconds", rising restart count) with health stuck at "starting".
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:5000/health && curl -sf -H \"Authorization: Bearer $$(sed -n 's/^api_key: *//p' /app/api_tokens.yml)\" localhost:5000/v1/model"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
